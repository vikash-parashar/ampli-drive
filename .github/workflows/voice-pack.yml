name: Voice pack

# Records the Haryanvi lines (voice/lines.json, generated from HaryanviLines.kt) in the two
# recorded voices with ElevenLabs and opens a PR with the clips. Manual only; the normal build
# never needs the ElevenLabs key.
#
# Setup (once): repo secret ELEVENLABS_API_KEY. Optional repo variables VOICE_ID_MALE and
# VOICE_ID_FEMALE (Settings › Secrets and variables › Actions › Variables); without them the
# list-voices job picks the most used Hindi male / female voice from the shared library.

on:
  workflow_dispatch:
    inputs:
      voices:
        description: "Voices to record (comma separated)"
        default: "male,female"
        required: true
        type: string
      only_missing:
        description: "Skip clips that already exist and match the current text"
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: voice-pack
  cancel-in-progress: false

jobs:
  list-voices:
    runs-on: ubuntu-latest
    outputs:
      male_id: ${{ steps.voices.outputs.male_id }}
      male_owner: ${{ steps.voices.outputs.male_owner }}
      female_id: ${{ steps.voices.outputs.female_id }}
      female_owner: ${{ steps.voices.outputs.female_owner }}
    steps:
      - name: Check the ElevenLabs secret
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::error title=Missing secret::ELEVENLABS_API_KEY is not set. Add it under Settings > Secrets and variables > Actions > New repository secret, then run this workflow again."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: List Hindi voice candidates
        id: voices
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          VOICE_ID_MALE: ${{ vars.VOICE_ID_MALE }}
          VOICE_ID_FEMALE: ${{ vars.VOICE_ID_FEMALE }}
        run: python3 scripts/voice_pack.py list-voices

  generate:
    needs: list-voices
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q ffmpeg; }
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libopus

      # Start from the latest voice-pack branch's clips, if any, so only_missing really skips them.
      - name: Reuse clips from the last voice-pack branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(git ls-remote --heads origin 'voice-pack/*' | awk '{print $2}' | sed 's#refs/heads/##' | sort -t/ -k2 -n | tail -1)
          if [ -n "$last" ] && [ ! -f app/src/main/assets/voice/male/clips.json ] && [ ! -f app/src/main/assets/voice/female/clips.json ]; then
            echo "Taking clips from $last"
            git fetch -q origin "$last"
            git checkout FETCH_HEAD -- app/src/main/assets/voice || true
            git reset -q
          fi

      - name: Record clips
        id: gen
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          MALE_ID: ${{ needs.list-voices.outputs.male_id }}
          MALE_OWNER: ${{ needs.list-voices.outputs.male_owner }}
          FEMALE_ID: ${{ needs.list-voices.outputs.female_id }}
          FEMALE_OWNER: ${{ needs.list-voices.outputs.female_owner }}
        run: |
          python3 scripts/voice_pack.py generate --voices "${{ inputs.voices }}" \
            ${{ inputs.only_missing && '--only-missing' || '' }}

      - name: Open a PR with the clips
        if: always() && steps.gen.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain app/src/main/assets/voice)" ]; then
            echo "::notice title=Voice pack::No new or changed clips."
            exit 0
          fi
          branch="voice-pack/${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add app/src/main/assets/voice
          git commit -q -m "Voice pack: recorded clips (run ${{ github.run_number }})"
          git push -q origin "$branch"
          summary=$(python3 -c "import json;d=json.load(open('voice-pack-summary.json'));print('\n'.join(f\"- {k}: {v['recorded']} recorded, {v['skipped']} skipped, {v['failed']} failed, {v['characters']} characters, {v['clips']}/{v['total']} clips\" for k,v in d['voices'].items()))" 2>/dev/null || echo "- see the run log")
          body=$(printf 'Recorded by the Voice pack workflow, run %s.\n\n%s\n\nPlayback falls back to the phone voice for any missing clip.\n' "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "$summary")
          if url=$(gh pr create --base "${{ github.ref_name }}" --head "$branch" --title "Voice pack: recorded clips (run ${{ github.run_number }})" --body "$body" 2>&1); then
            echo "::notice title=Voice pack PR::$url"
          else
            echo "::warning title=Voice pack::Pushed $branch but could not open a PR ($url). Allow it under Settings > Actions > General > 'Allow GitHub Actions to create and approve pull requests', or open it by hand: ${{ github.server_url }}/${{ github.repository }}/compare/$branch"
          fi
          # PRs opened with the workflow token don't trigger other workflows: build the APK explicitly.
          gh workflow run build-apk.yml --ref "$branch" && echo "::notice title=Voice pack::Started Build APK on $branch" || true
