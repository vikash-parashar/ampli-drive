name: Build APK

on:
  push:
    branches: [main]
  # Pull requests build, test and upload the APK, but never publish a build-N release.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Help & feedback server (Settings › Variables › Actions). Empty = email fallback in the app.
      OWNER_API_URL: ${{ vars.OWNER_API_URL }}
      # In-app navigation routing server (your own OSRM). Empty = OSRM's public demo server, testing only.
      ROUTING_BASE_URL: ${{ vars.ROUTING_BASE_URL }}
      # Place search server (your own Photon). Empty = Photon's public demo server, testing only.
      GEOCODER_URL: ${{ vars.GEOCODER_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners ship with the Android SDK preinstalled.
      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Speed cameras from OpenStreetMap (ODbL). Best effort: if Overpass is down, the
      # committed assets/cameras.json is bundled instead and the build carries on.
      - name: Fetch speed-camera data
        continue-on-error: true
        timeout-minutes: 8
        run: python3 scripts/fetch_cameras.py

      # Also renders the screen previews (ScreenshotTest: Robolectric + Roborazzi, 1024x600, no emulator).
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      # Fails on any API call newer than minSdk (26) that has no version check.
      - name: Lint (NewApi)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug || { cat app/build/reports/lint-results-debug.txt; exit 1; }

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/debug/app-debug.apk "AmpliCarHub-${GITHUB_RUN_NUMBER}.apk"

      - name: Rename PR APK
        if: github.event_name == 'pull_request'
        run: cp app/build/outputs/apk/debug/app-debug.apk "AmpliCarHub-pr-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AmpliCarHub-apk
          path: AmpliCarHub-*.apk

      # Screen previews to look at without installing the APK.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AmpliCarHub-screens
          path: app/build/outputs/roborazzi/*.png
          if-no-files-found: warn

      # A release gives a direct download link that opens in the head unit's browser.
      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: build-${{ github.run_number }}
          name: Ampli Car Hub test build ${{ github.run_number }}
          prerelease: true
          files: |
            AmpliCarHub-*.apk
            app/build/outputs/roborazzi/*.png

      # PR test builds get their own pr-test-N prerelease so they can be sideloaded the
      # same way. Forks have a read-only token, so they only get the artifact.
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          tag_name: pr-test-${{ github.run_number }}
          target_commitish: ${{ github.event.pull_request.head.sha }}
          name: "Ampli Car Hub PR #${{ github.event.pull_request.number }} test build ${{ github.run_number }}"
          prerelease: true
          files: |
            AmpliCarHub-pr-*.apk
            app/build/outputs/roborazzi/*.png

  # Release build with R8 (minify + shrink resources), as Play gets it. Unsigned here: the
  # upload key is added only when publishing. Missing keep rules show up as error annotations.
  release-bundle:
    runs-on: ubuntu-latest
    env:
      OWNER_API_URL: ${{ vars.OWNER_API_URL }}
      # A release refuses to build without these two (no demo servers in Play builds).
      ROUTING_BASE_URL: ${{ vars.ROUTING_BASE_URL }}
      GEOCODER_URL: ${{ vars.GEOCODER_URL }}
      # Owner's choice: set the repository variable ALLOW_UNCONFIGURED_SERVERS=true to let this job
      # check R8 before the own servers exist. The AAB it makes is then for testing only.
      ALLOW_UNCONFIGURED_SERVERS: ${{ vars.ALLOW_UNCONFIGURED_SERVERS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Release bundle (R8)
        # bash -eo pipefail: a failing gradlew fails the step even though its output goes through tee.
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease 2>&1 | tee release.log || {
            for f in $(find app/build/outputs/mapping -name missing_rules.txt 2>/dev/null); do
              grep -v '^#' "$f" | grep . | head -40 | sed 's/^/::error title=R8 missing rule::/'
            done
            grep -E "^e: |ERROR:|Missing class|R8: " release.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: AmpliCarHub-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
