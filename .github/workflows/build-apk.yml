name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners ship with the Android SDK preinstalled.
      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Speed cameras from OpenStreetMap (ODbL). Best effort: if Overpass is down, the
      # committed assets/cameras.json is bundled instead and the build carries on.
      - name: Fetch speed-camera data
        continue-on-error: true
        timeout-minutes: 8
        run: python3 scripts/fetch_cameras.py

      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "AmpliCarHub-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AmpliCarHub-apk
          path: AmpliCarHub-*.apk

      # A release gives a direct download link that opens in the head unit's browser.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ampli Car Hub test build ${{ github.run_number }}
          prerelease: true
          files: AmpliCarHub-*.apk
