name: Build APK

on:
  push:
    branches: [main]
  # Pull requests build, test and upload the APK, but never publish a build-N release.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Help & feedback server (Settings › Variables › Actions). Empty = email fallback in the app.
      OWNER_API_URL: ${{ vars.OWNER_API_URL }}
      # In-app navigation routing server (your own OSRM). Empty = OSRM's public demo server, testing only.
      ROUTING_BASE_URL: ${{ vars.ROUTING_BASE_URL }}
      # Place search server (your own Photon). Empty = Photon's public demo server, testing only.
      GEOCODER_URL: ${{ vars.GEOCODER_URL }}
      # Route weather server. Empty = Open-Meteo's public API in debug builds.
      WEATHER_URL: ${{ vars.WEATHER_URL }}
      # Remote config JSON. Empty = built-in defaults.
      REMOTE_CONFIG_URL: ${{ vars.REMOTE_CONFIG_URL }}
      # Weather API key: a secret (Settings › Secrets › Actions), never a plain variable.
      WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
      # Our own map style, tried when the theme's style fails to load. Empty = none.
      MAP_FALLBACK_STYLE_URL: ${{ vars.MAP_FALLBACK_STYLE_URL }}
      # Pro launch-offer line in the Pro sheet. Empty = on; set to false when the offer ends.
      LAUNCH_OFFER: ${{ vars.LAUNCH_OFFER }}
      # Report sharing server (none yet). Empty = reports stay on each unit.
      REPORT_SYNC_URL: ${{ vars.REPORT_SYNC_URL }}
      # Offline-map style allowed for download. Empty = the map's own OpenFreeMap style.
      OFFLINE_MAP_STYLE_URL: ${{ vars.OFFLINE_MAP_STYLE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners ship with the Android SDK preinstalled.
      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Speed cameras from OpenStreetMap (ODbL). Best effort: if Overpass is down, the
      # committed assets/cameras.json is bundled instead and the build carries on.
      - name: Fetch speed-camera data
        continue-on-error: true
        timeout-minutes: 8
        run: python3 scripts/fetch_cameras.py

      - name: Fetch fuel and charging-station data
        continue-on-error: true
        timeout-minutes: 10
        env:
          # Optional: merges Open Charge Map EV chargers; skipped with a notice when unset.
          OPENCHARGEMAP_KEY: ${{ secrets.OPENCHARGEMAP_KEY }}
        run: python3 scripts/fetch_fuel.py

      # Bundled voice engine: show the licence each candidate voice carries inside its file (the
      # flitevox "copyright" field). Informational; never fails the build. festvox.org is HTTP only.
      - name: Bundled voice licences
        continue-on-error: true
        timeout-minutes: 4
        shell: bash
        run: |
          set +e +o pipefail
          for name in cmu_indic_hin_ab; do
            head=$(curl -fsL --max-time 60 -r 0-65535 "http://festvox.org/flite/packed/flite-2.1/voices/$name.flitevox" | tr -c '[:print:]\n' '\n' | grep -a -E -A16 '^(variant|copyright)$' | head -40 | tr '\n' ' ' | tr -s ' ' | cut -c1-500)
            echo "::notice title=Voice licence $name::${head:-could not read the header}"
          done

      # The app downloads the voices over HTTPS from this repository's tts-voices-1 release
      # (TtsVoiceSpec.url); festvox.org itself has no HTTPS. Fills the release once, from
      # festvox.org, after checking each file's SHA-512. Never fails the build.
      - name: Mirror bundled voices
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=tts-voices-1
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --prerelease --title "Ampli voice engine voices (data, not an app build)" \
              --notes "Unmodified CMU Flite voices (festvox.org, CMU's free licence; see app/src/main/assets/licenses/flite.txt) that Ampli Car Hub downloads on sideloaded installs. Play installs carry them in the voicemodels asset pack."
          fi
          have=$(gh release view "$tag" --json assets --jq '.assets[].name')
          mkdir -p "$RUNNER_TEMP/voices"
          while read -r name sha; do
            if grep -qx "$name" <<<"$have"; then echo "$name: already mirrored"; continue; fi
            f="$RUNNER_TEMP/voices/$name"
            curl -fL --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 30 -o "$f" "http://festvox.org/flite/packed/flite-2.1/voices/$name"
            echo "$sha  $f" | sha512sum -c --quiet -
            gh release upload "$tag" "$f"
            echo "::notice title=Mirrored voice::$name"
          done <<'LIST'
          cmu_indic_hin_ab.flitevox c84a8a2e76ff237a9ab3678acddc8874e20be6693d3f00d08354537dc0ce7938059227024e89d9cd06aa1b16817a8d4c0b3872eae67c8980970226899bf0ed17
          LIST

      # Also renders the screen previews (ScreenshotTest: Robolectric + Roborazzi, 1024x600, no emulator).
      - name: Unit tests
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee unit-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" != 0 ]; then
            # Job logs are not always readable; surface compiler errors and failed tests as one annotation.
            summary=$(grep -E -A4 '^e: |FAILED$|What went wrong' unit-tests.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Unit tests failed::${summary}"
          fi
          exit $status

      # Fails on any API call newer than minSdk (26) that has no version check.
      - name: Lint (NewApi)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug || { cat app/build/reports/lint-results-debug.txt; exit 1; }

      # The sideloaded test APK is a release-speed build (build type fastTest: R8, not debuggable,
      # baseline profile), signed with the same fixed test key and the same application id as the
      # earlier debug test APKs, so it still installs as an update over them. A debug build runs
      # several times slower on 1-2 GB head units. If R8 trips over a missing keep rule, the debug
      # APK is shipped instead (with an error annotation), so there is always something to install.
      - name: Build test APK
        shell: bash
        run: |
          chmod +x gradlew
          if ./gradlew --no-daemon assembleFastTest 2>&1 | tee fast-test.log; then
            cp app/build/outputs/apk/fastTest/app-fastTest.apk test.apk
          else
            for f in $(find app/build/outputs/mapping -name missing_rules.txt 2>/dev/null); do
              grep -v '^#' "$f" | grep . | head -40 | sed 's/^/::error title=R8 missing rule::/'
            done
            grep -E "^e: |ERROR:|Missing class|R8: " fast-test.log | head -20 | sed 's/^/::error title=Fast test build::/'
            echo "::error title=Test APK is a debug build::The fast (release-type) test build failed, so this APK is the slower debug build. Fix the error above."
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk test.apk
          fi

      - name: Rename APK
        if: github.event_name != 'pull_request'
        run: cp test.apk "AmpliCarHub-${GITHUB_RUN_NUMBER}.apk"

      - name: Rename PR APK
        if: github.event_name == 'pull_request'
        run: cp test.apk "AmpliCarHub-pr-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AmpliCarHub-apk
          path: AmpliCarHub-*.apk

      # R8 renames classes in the test APK: this file turns a crash stack trace back into names.
      - uses: actions/upload-artifact@v4
        with:
          name: AmpliCarHub-r8-mapping
          path: app/build/outputs/mapping/fastTest/mapping.txt
          if-no-files-found: ignore

      # Screen previews to look at without installing the APK.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AmpliCarHub-screens
          path: app/build/outputs/roborazzi/*.png
          if-no-files-found: warn

      # A release gives a direct download link that opens in the head unit's browser.
      - uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: build-${{ github.run_number }}
          name: Ampli Car Hub test build ${{ github.run_number }}
          prerelease: true
          files: |
            AmpliCarHub-*.apk
            app/build/outputs/roborazzi/*.png

      # PR test builds get their own pr-test-N prerelease so they can be sideloaded the
      # same way. Forks have a read-only token, so they only get the artifact.
      - uses: softprops/action-gh-release@v2
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        with:
          tag_name: pr-test-${{ github.run_number }}
          target_commitish: ${{ github.event.pull_request.head.sha }}
          name: "Ampli Car Hub PR #${{ github.event.pull_request.number }} test build ${{ github.run_number }}"
          prerelease: true
          files: |
            AmpliCarHub-pr-*.apk
            app/build/outputs/roborazzi/*.png

  # Release build with R8 (minify + shrink resources), as Play gets it. Unsigned here: the
  # upload key is added only when publishing. Missing keep rules show up as error annotations.
  release-bundle:
    runs-on: ubuntu-latest
    env:
      OWNER_API_URL: ${{ vars.OWNER_API_URL }}
      # A release refuses to build without these two (no demo servers in Play builds).
      ROUTING_BASE_URL: ${{ vars.ROUTING_BASE_URL }}
      GEOCODER_URL: ${{ vars.GEOCODER_URL }}
      # Optional in a release: weather stays off and remote config uses defaults while empty.
      WEATHER_URL: ${{ vars.WEATHER_URL }}
      REMOTE_CONFIG_URL: ${{ vars.REMOTE_CONFIG_URL }}
      WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
      MAP_FALLBACK_STYLE_URL: ${{ vars.MAP_FALLBACK_STYLE_URL }}
      # Pro launch-offer line in the Pro sheet. Empty = on; set to false when the offer ends.
      LAUNCH_OFFER: ${{ vars.LAUNCH_OFFER }}
      # Owner's choice: set the repository variable ALLOW_UNCONFIGURED_SERVERS=true to let this job
      # check R8 before the own servers exist. The AAB it makes is then for testing only.
      ALLOW_UNCONFIGURED_SERVERS: ${{ vars.ALLOW_UNCONFIGURED_SERVERS }}
      UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
      UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
      UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # Offline speech models for the Play install-time asset pack (:voicemodels), so a Play
      # install has voice on first start with no download. Only this job needs them: asset packs
      # go into the app bundle, never into assembled test APKs (the sideloaded test APK downloads
      # the models itself on first start). Cached by file name; bump the names in WakeModel.kt
      # (VoskModelSpec) and here together.
      - name: Cache speech models
        uses: actions/cache@v4
        with:
          path: voicemodels/src/main/assets/vosk/*.zip
          key: vosk-vosk-model-small-en-in-0.4.zip-vosk-model-small-hi-0.22.zip

      - name: Fetch speech models
        shell: bash
        run: |
          set -euo pipefail
          dir=voicemodels/src/main/assets/vosk
          mkdir -p "$dir"
          for name in vosk-model-small-en-in-0.4 vosk-model-small-hi-0.22; do
            zip="$dir/$name.zip"
            if [ -s "$zip" ] && unzip -tq "$zip" >/dev/null 2>&1; then
              echo "$name: cached"
              continue
            fi
            rm -f "$zip"
            curl -fL --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 30 \
              -o "$zip.part" "https://alphacephei.com/vosk/models/$name.zip" || {
              echo "::error title=Speech models::Could not download $name.zip from alphacephei.com"
              exit 1
            }
            # A whole, readable zip with the model's top folder (WakeModel drops that folder).
            unzip -tq "$zip.part" >/dev/null || { echo "::error title=Speech models::$name.zip is damaged"; exit 1; }
            unzip -l "$zip.part" | grep " $name/" >/dev/null || { echo "::error title=Speech models::$name.zip has no $name/ folder"; exit 1; }
            mv "$zip.part" "$zip"
          done
          ls -l "$dir"
          sha256sum "$dir"/*.zip

      # The bundled voice engine's Flite voices for the same asset pack (assets/tts), checked
      # against the SHA-512 in TtsVoiceSpec (TtsVoiceFiles.kt); keep the two lists in step.
      - name: Cache bundled voices
        uses: actions/cache@v4
        with:
          path: voicemodels/src/main/assets/tts/*.flitevox
          key: flitevox-cmu_indic_hin_ab-v1

      - name: Fetch bundled voices
        shell: bash
        run: |
          set -euo pipefail
          dir=voicemodels/src/main/assets/tts
          mkdir -p "$dir"
          while read -r name sha; do
            f="$dir/$name"
            if [ -s "$f" ] && echo "$sha  $f" | sha512sum -c --quiet - 2>/dev/null; then
              echo "$name: cached"
              continue
            fi
            rm -f "$f"
            curl -fL --retry 3 --retry-delay 10 --retry-all-errors --connect-timeout 30 \
              -o "$f.part" "https://github.com/${{ github.repository }}/releases/download/tts-voices-1/$name" ||
            curl -fL --retry 5 --retry-delay 10 --retry-all-errors --connect-timeout 30 \
              -o "$f.part" "http://festvox.org/flite/packed/flite-2.1/voices/$name" || {
              echo "::error title=Bundled voices::Could not download $name"
              exit 1
            }
            echo "$sha  $f.part" | sha512sum -c --quiet - || { echo "::error title=Bundled voices::$name does not match its SHA-512"; exit 1; }
            mv "$f.part" "$f"
          done <<'LIST'
          cmu_indic_hin_ab.flitevox c84a8a2e76ff237a9ab3678acddc8874e20be6693d3f00d08354537dc0ce7938059227024e89d9cd06aa1b16817a8d4c0b3872eae67c8980970226899bf0ed17
          LIST
          ls -l "$dir"

      # Play upload key: only when the secret exists (never on pull requests from forks).
      - name: Upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::notice title=Play upload key::UPLOAD_KEYSTORE_BASE64 is not set; the AAB is unsigned."
          fi

      - name: Release bundle (R8)
        # bash -eo pipefail: a failing gradlew fails the step even though its output goes through tee.
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease 2>&1 | tee release.log || {
            for f in $(find app/build/outputs/mapping -name missing_rules.txt 2>/dev/null); do
              grep -v '^#' "$f" | grep . | head -40 | sed 's/^/::error title=R8 missing rule::/'
            done
            grep -E "^e: |ERROR:|Missing class|R8: " release.log | head -40 | sed 's/^/::error::/'
            exit 1
          }

      # The bundle must carry both models in the install-time pack, or Play installs would
      # fall back to downloading them.
      - name: Check speech models in the bundle
        shell: bash
        run: |
          aab=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          for name in vosk-model-small-en-in-0.4 vosk-model-small-hi-0.22; do
            unzip -l "$aab" | grep "voicemodels/assets/vosk/$name.zip" >/dev/null || {
              echo "::error title=Speech models::$name.zip is missing from the voicemodels asset pack in $aab"
              unzip -l "$aab" | grep voicemodels | head -20
              exit 1
            }
          done
          ls -l "$aab"

      - uses: actions/upload-artifact@v4
        with:
          name: AmpliCarHub-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # A signed bundle from main goes on a play-N release, ready to upload in Play Console.
      - name: Publish the signed AAB
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.UPLOAD_KEYSTORE_FILE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/bundle/release/*.aab "AmpliCarHub-${{ github.run_number }}.aab"
          gh release create "play-${{ github.run_number }}" "AmpliCarHub-${{ github.run_number }}.aab" \
            --prerelease --title "Play bundle ${{ github.run_number }}" \
            --notes "Signed with the upload key. Upload this file in Play Console > Testing > Closed testing."
